<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>로그인</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-5"><main class="col-md-5"><h1>로그인</h1>
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label class="form-label">사용자<input class="form-control" name="username" autocomplete="username" required></label>
<label class="form-label">비밀번호<input class="form-control" name="password" type="password" autocomplete="current-password" required></label>
<button class="btn btn-primary" type="submit">로그인</button>
</form></main></body></html>
