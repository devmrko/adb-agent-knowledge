<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>프로젝트</title>
<meta name="_csrf" content="{{ csrf }}"><meta name="_csrf_header" content="X-CSRF-TOKEN">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-5"><main><h1>프로젝트</h1>
<form method="post" action="{{ url_for('create_page') }}" class="d-flex gap-2 my-4">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input class="form-control" name="name" maxlength="160" required aria-label="프로젝트 이름">
<button class="btn btn-primary" type="submit">추가</button></form>
<ul class="list-group">{% for project in listing.items %}
<li class="list-group-item">{{ project.name }} <small class="text-secondary">v{{ project.version }}</small></li>
{% endfor %}</ul><p class="mt-3">총 {{ listing.total }}개</p>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}">
<button class="btn btn-outline-secondary">로그아웃</button></form></main></body></html>
