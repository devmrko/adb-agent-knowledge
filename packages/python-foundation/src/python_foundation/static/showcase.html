<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundation UI 구성 요소</title><link rel="stylesheet" href="/knowledge-assets/ui.css"><script defer src="/knowledge-assets/ui.js"></script></head><body><main class="ui-stack showcase">
<ui-page-header heading="Foundation UI" description="HTML 요소와 CSS 클래스로 재사용하는 공통 구성 요소"></ui-page-header>
<section class="ui-panel showcase-section ui-stack"><h2>버튼과 입력</h2><div class="ui-inline"><button class="ui-button ui-button--primary">주요 동작</button><button class="ui-button">보조 동작</button><button class="ui-button ui-button--quiet">텍스트 동작</button><button class="ui-button" disabled>사용할 수 없음</button></div><label class="ui-field">검색어<input class="ui-input" type="search" placeholder="검색어를 입력하세요"></label></section>
<section class="ui-panel showcase-section"><h2>상태</h2><div class="ui-inline"><ui-badge>기본</ui-badge><ui-badge tone="success">저장 완료</ui-badge><ui-badge tone="info">결정</ui-badge><ui-badge tone="warning">확인 필요</ui-badge><ui-badge tone="danger">연결 실패</ui-badge></div></section>
<section class="ui-panel showcase-section"><h2>목록 항목</h2><button class="ui-record" aria-current="true"><span class="ui-record__icon" data-icon="document"></span><span class="ui-record__body"><strong class="ui-record__title">선택한 지식의 제목</strong><span class="ui-record__meta"><span class="ui-badge ui-badge--info">결정</span>프로젝트</span><span class="ui-record__preview">목록에서 요약을 확인하고 필요한 항목의 상세로 들어갑니다.</span></span></button><button class="ui-record"><span class="ui-record__icon" data-icon="memory"></span><span class="ui-record__body"><strong class="ui-record__title">기억의 제목</strong><span class="ui-record__meta">경험 · 현재 기록</span></span></button></section>
<section class="ui-panel showcase-section"><h2>빈 상태</h2><ui-empty-state heading="검색 결과가 없습니다" description="검색어를 바꾸거나 검색 조건을 줄여보세요." icon="search"></ui-empty-state></section>
</main></body></html>
